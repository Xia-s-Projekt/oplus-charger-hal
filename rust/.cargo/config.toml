# The NDK clang driver is the linker so crtbegin/crtend and libc come from the
# NDK sysroot instead of the host. Its bin directory must be on PATH; the
# checkout-specific linker search path and extra flags are supplied by
# rust/build.sh through RUSTFLAGS so nothing here depends on a local path.
[target.aarch64-linux-android]
linker = "aarch64-linux-android34-clang"

[build]
# Nothing else here on purpose: the target is selected with --target.
